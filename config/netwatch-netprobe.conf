# Netwatch NIC Health Sampler Configuration
#
# This file is sourced by netwatch-netprobe.sh and should contain only
# KEY=VALUE pairs. It will be installed to /etc/default/netwatch-netprobe
# with permissions 0640 (root:root).
#
# The sampler is READ-ONLY: it never changes NIC configuration. To apply the
# e1000e offload workaround, use scripts/netwatch-nic-remediation.sh.
#

#
# Interface Selection
#

# Physical interface to sample. Leave empty to auto-detect the physical uplink
# behind the default route.
#
# On Proxmox the default route points at a bridge (vmbr0), but counters and
# offload state live on the enslaved physical port - and the bridge reports
# nominal state even while the underlying NIC is wedged. Auto-detection
# descends through the bridge to the hardware, so leaving this empty is
# usually correct. Set it explicitly for a multi-NIC host.
#NETPROBE_IFACE="eno1"

#
# Gateway Reachability
#

# Probe the default gateway each sample: 1 = enabled, 0 = disabled
# This is a LOCAL adjacency check (L2/L3), deliberately distinct from
# netwatch-agent's WAN targets - it distinguishes "my NIC is wedged" from
# "the internet is down".
NETPROBE_CHECK_GATEWAY=1

# Gateway IP. Leave empty to derive it from the default route.
#NETPROBE_GATEWAY="10.0.0.2"

# Probes per sample. Kept above 1 so a single dropped packet is not reported
# as an outage.
NETPROBE_PING_COUNT=3

# Timeout in seconds for each gateway probe
NETPROBE_PING_TIMEOUT=2

#
# Logging
#

# Mirror samples to a plain-text file in addition to the journal.
# The journal is authoritative; this file is a convenience for tail/grep.
# 1 = enabled, 0 = journal only
NETPROBE_LOG_TO_FILE=1

# Path for the plain-text mirror (rotated by /etc/logrotate.d/netwatch-netprobe)
NETPROBE_LOG_FILE="/var/log/netwatch/net-health.log"

#
# Notes on log priorities
#
# Routine samples are logged at daemon.info. Anomalies - a Hardware Unit Hang,
# offloads silently re-enabling, an unreachable gateway, or a down link - are
# logged at daemon.crit, because journald fsyncs immediately at crit and above.
# That means an anomaly line survives a hard power-cycle, whereas a routine
# sample may still be sitting in the page cache.
#
# Review samples with:
#   journalctl -t netwatch-netprobe -f
#   journalctl -t netwatch-netprobe -p crit --no-pager
