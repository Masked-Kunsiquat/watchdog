# Netwatch Daily Digest Configuration
#
# Appended to /etc/default/netwatch-netprobe by the installer, or kept as a
# standalone file. Only KEY=VALUE pairs.
#
# The digest reads the agent's webhook settings from
# /etc/default/netwatch-agent, so it reuses WEBHOOK_URL, WEBHOOK_HEADERS, and
# WEBHOOK_TIMEOUT without duplicating credentials.
#

# Send the digest at all: 1 = enabled, 0 = disabled
DIGEST_ENABLED=1

# Window the digest summarises, in hours. Match this to the timer interval.
DIGEST_WINDOW_HOURS=24

# Include the hostname in the message.
#
# Off by default: the digest usually goes to a third-party service such as
# Discord. IP and MAC addresses are NEVER included regardless of this setting;
# the interface name (e.g. eno1) is a local label with no addressing
# information and is always shown.
DIGEST_INCLUDE_HOSTNAME=0

# Send the digest somewhere other than the agent's WEBHOOK_URL - useful to keep
# the noisy outage alerts and the daily summary in separate channels.
#DIGEST_WEBHOOK_URL="https://discord.com/api/webhooks/..."

#
# Message template
#
# Any {PLACEHOLDER} below is substituted. To trim verbosity, write a template
# containing only the fields you care about - omitted placeholders simply do
# not appear. Leave unset for the full default table.
#
# Available placeholders:
#
#   Identity / context
#     {DATE}             Local timestamp of the digest
#     {HOSTNAME}         Hostname, or "(redacted)" per DIGEST_INCLUDE_HOSTNAME
#     {IFACE}            Physical interface name
#     {UPTIME}           Host uptime, humanised
#     {WINDOW_HOURS}     The window this digest covers
#
#   Verdict
#     {VERDICT}          HOLDING | ATTENTION | DEGRADED
#     {VERDICT_NOTES}    Why, e.g. "hardware-unit-hang offloads-re-enabled"
#
#   NIC health
#     {OPERSTATE}        Link state (up/down)
#     {OFFLOADS}         e.g. "tso=off gso=off gro=off"
#     {HANGS}            "Detected Hardware Unit Hang" count in the window
#     {TXTIMEOUTS}       NETDEV watchdog timeouts
#     {RESETS}           "Reset adapter unexpectedly" count
#     {ME}               ME firmware corruption events
#     {LINK_CHANGES}     NIC Link Up/Down transitions
#     {CARRIER_DOWN}     Lifetime carrier_down_count
#
#   Driver counters (Δ = change since the previous digest)
#     {TX_TIMEOUT} {D_TX_TIMEOUT}
#     {TX_RESTART} {D_TX_RESTART}
#     {RX_MISSED}  {RX_CRC}
#
#   WAN
#     {DAY_OUTAGES}      Outages in the window
#     {DAY_DOWNTIME}     Downtime in the window, humanised
#     {DRYRUN_TRIPS}     "would reboot now" messages (false positives while
#                        DRY_RUN=1)
#     {TOTAL_OUTAGES} {TOTAL_RECOVERIES} {TOTAL_REBOOTS} {TOTAL_DOWNTIME}
#
# Minimal one-liner - just the verdict:
#   DIGEST_BODY_TEMPLATE="Netwatch {DATE}: **{VERDICT}** ({VERDICT_NOTES})"
#
# Compact - the numbers that matter while confirming the e1000e fix:
#   DIGEST_BODY_TEMPLATE="**{VERDICT}** {DATE} — hangs={HANGS} tx_timeout={TX_TIMEOUT} tx_restart={TX_RESTART}(Δ{D_TX_RESTART}) offloads: {OFFLOADS} | WAN outages={DAY_OUTAGES} trips={DRYRUN_TRIPS}"
#
# Quiet - only speak up when something is wrong (pair with a wrapper that
# checks the verdict, or just read the journal on HOLDING days):
#   DIGEST_BODY_TEMPLATE="{VERDICT}: {VERDICT_NOTES} — hangs={HANGS} offloads: {OFFLOADS}"
#
#DIGEST_BODY_TEMPLATE=""

#
# Changing the delivery time
#
# The timer ships with OnCalendar=*-*-* 21:00:00. Override it with a drop-in so
# a package upgrade does not revert the change:
#
#   systemctl edit netwatch-digest.timer
#
#   [Timer]
#   OnCalendar=
#   OnCalendar=*-*-* 08:30:00
#
# The empty OnCalendar= line first is required; without it the setting
# accumulates and the timer fires at both times.
#
# Verify with:  systemctl list-timers netwatch-digest
# Test now:     systemctl start netwatch-digest.service
